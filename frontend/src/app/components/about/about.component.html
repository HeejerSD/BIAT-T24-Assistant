<section class="about-hero">
  <div class="container">
    <span class="tag">À propos</span>
    <h1 class="about-title">Tout ce dont l'équipe IT a besoin</h1>
    <p class="about-sub">Un outil pensé pour les développeurs et consultants T24 de BIAT.</p>
  </div>
</section>

<section class="features">
  <div class="container">
    <div class="features-grid">
      <div class="feature-card" *ngFor="let f of features">
        <div class="feature-icon">{{ f.icon }}</div>
        <h3 class="feature-title">{{ f.title }}</h3>
        <p class="feature-desc">{{ f.desc }}</p>
      </div>
    </div>
  </div>
</section>

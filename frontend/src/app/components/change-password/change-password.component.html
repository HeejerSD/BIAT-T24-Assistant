<section class="users-hero">
  <div class="container">
    <span class="tag">Mon compte</span>
    <h1 class="users-title">Changer mon mot de passe</h1>
    <p class="users-sub">Saisissez votre mot de passe actuel puis le nouveau.</p>
  </div>
</section>

<section class="users-content">
  <div class="container">
    <div class="users-card">

      @if (success) {
        <div class="alert alert-success">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
          {{ success }}
        </div>
      }
      @if (error) {
        <div class="alert alert-error">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          {{ error }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" novalidate>
        <div class="form-group">
          <label for="currentPassword">Mot de passe actuel</label>
          <input id="currentPassword" type="password" [(ngModel)]="currentPassword" name="currentPassword" autocomplete="current-password" />
        </div>

        <div class="form-group">
          <label for="newPassword">Nouveau mot de passe</label>
          <input id="newPassword" type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="Min. 6 caractères" autocomplete="new-password" />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmer le nouveau mot de passe</label>
          <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" autocomplete="new-password" />
        </div>

        <button type="submit" class="btn-primary btn-submit" [disabled]="loading">
          @if (loading) {
            <span class="spinner"></span>
            Modification en cours...
          } @else {
            Modifier le mot de passe
          }
        </button>
      </form>
    </div>
  </div>
</section>

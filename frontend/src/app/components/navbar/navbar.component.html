<nav class="navbar" [class.scrolled]="scrolled">
  <div class="nav-inner">

    <div class="nav-left">
      <button type="button" class="nav-back" *ngIf="showBack" (click)="goBack()" aria-label="Retour">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>

      <a routerLink="/home" class="nav-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 60 60" fill="none">
            <path d="M10 50L25 10L35 35L45 20L55 50Z" fill="#1A4F8A"/>
            <path d="M10 50L25 10L35 35Z" fill="#009FC2" opacity=".75"/>
          </svg>
        </div>
        <div>
          <span class="logo-name">BIAT</span>
          <span class="logo-sub">Innovation and technology</span>
        </div>
      </a>
    </div>

    <div class="nav-links" [class.open]="menuOpen">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-link">Accueil</a>
      <a routerLink="/chat" routerLinkActive="active" class="nav-link">Assistant T24</a>

      <a
        class="notif-bell"
        *ngIf="isSuperAdmin"
        routerLink="/admin/dashboard"
        title="Dashboard"
      >
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      </a>

      <div class="nav-user" *ngIf="username">
        <span class="user-trigger">
          <span class="user-avatar">{{ username.charAt(0).toUpperCase() }}</span>
          <span class="user-name">{{ username }}</span>
        </span>

        <button type="button" class="logout-btn" (click)="logout()" title="Déconnexion">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          <span>Déconnexion</span>
        </button>
      </div>
    </div>

    <button class="menu-btn" (click)="toggleMenu()" aria-label="Menu">
      <span [class.open]="menuOpen"></span>
      <span [class.open]="menuOpen"></span>
      <span [class.open]="menuOpen"></span>
    </button>

  </div>
</nav>
